  <circle cx="126" cy="92" r="9" fill="#1c1e21" />
  <circle cx="77" cy="89" r="2.5" fill="#f4f5f7" />
  <circle cx="129" cy="89" r="2.5" fill="#f4f5f7" />

  <!-- nose -->
