  <path d="M100,138 Q78,142 68,158" fill="none" stroke="#1c1e21" stroke-width="3" stroke-linecap="round" />
  <path d="M100,138 Q122,142 132,158" fill="none" stroke="#1c1e21" stroke-width="3" stroke-linecap="round" />

  <!-- collar -->
