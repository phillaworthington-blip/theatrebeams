<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 220">

  <!-- happy dog -->
  <g transform="translate(20,25) scale(0.8)">
    <path d="M52,64 Q38,32 52,10 Q72,28 74,60 Z" fill="#00356B" />
    <path d="M148,64 Q162,32 148,10 Q128,28 126,60 Z" fill="#00356B" />
    <ellipse cx="100" cy="102" rx="66" ry="60" fill="#00356B" />
    <ellipse cx="100" cy="132" rx="46" ry="34" fill="#f4f5f7" />

    <!-- raised, happy brows -->
    <path d="M64,80 Q100,64 136,80" fill="none" stroke="#00253f" stroke-width="4" stroke-linecap="round" />

    <circle cx="62" cy="126" r="8" fill="#f2b8c0" opacity="0.6" />
    <circle cx="138" cy="126" r="8" fill="#f2b8c0" opacity="0.6" />

    <circle cx="74" cy="92" r="9" fill="#1c1e21" />
    <circle cx="126" cy="92" r="9" fill="#1c1e21" />
    <circle cx="77" cy="89" r="2.5" fill="#f4f5f7" />
    <circle cx="129" cy="89" r="2.5" fill="#f4f5f7" />

    <ellipse cx="100" cy="118" rx="14" ry="10" fill="#1c1e21" />
    <ellipse cx="95" cy="116" rx="2.5" ry="3" fill="#4a4d52" />
    <ellipse cx="105" cy="116" rx="2.5" ry="3" fill="#4a4d52" />

    <!-- big open smile -->
    <path d="M70,132 Q100,162 130,132" fill="none" stroke="#1c1e21" stroke-width="3.5" stroke-linecap="round" />
    <path d="M88,144 Q100,156 112,144 Z" fill="#e0656f" />

    <path d="M52,150 Q100,172 148,150 L148,160 Q100,182 52,160 Z" fill="#00356B" />
    <circle cx="100" cy="168" r="6" fill="#f4c542" stroke="#00253f" stroke-width="1.5" />
  </g>

  <!-- I-beam cross-section -->
  <g stroke="#2f4f6b" stroke-width="3" stroke-linejoin="round">
    <rect x="200" y="40" width="90" height="20" rx="3" fill="#5c7a99" />
    <rect x="233" y="60" width="24" height="100" fill="#5c7a99" />
    <rect x="200" y="160" width="90" height="20" rx="3" fill="#5c7a99" />
  </g>
  <circle cx="215" cy="50" r="3" fill="#2f4f6b" />
  <circle cx="275" cy="50" r="3" fill="#2f4f6b" />
  <circle cx="215" cy="170" r="3" fill="#2f4f6b" />
  <circle cx="275" cy="170" r="3" fill="#2f4f6b" />

  <!-- sad dog -->
  <g transform="translate(310,25) scale(0.8)">
    <path d="M46,70 C20,80 14,120 34,148 C46,132 54,110 60,88 Z" fill="#00356B" />
    <path d="M154,70 C180,80 186,120 166,148 C154,132 146,110 140,88 Z" fill="#00356B" />
    <ellipse cx="100" cy="102" rx="66" ry="60" fill="#00356B" />
    <ellipse cx="100" cy="132" rx="46" ry="34" fill="#f4f5f7" />

    <!-- worried, sad brows -->
    <path d="M58,88 L84,74" fill="none" stroke="#00253f" stroke-width="4" stroke-linecap="round" />
    <path d="M116,74 L142,88" fill="none" stroke="#00253f" stroke-width="4" stroke-linecap="round" />

    <circle cx="74" cy="94" r="9" fill="#1c1e21" />
    <circle cx="126" cy="94" r="9" fill="#1c1e21" />
    <circle cx="77" cy="91" r="2.5" fill="#f4f5f7" />
    <circle cx="129" cy="91" r="2.5" fill="#f4f5f7" />
    <path d="M62,100 q5,11 0,18 q-5,-7 0,-18 Z" fill="#6ea8e0" />

    <ellipse cx="100" cy="120" rx="14" ry="10" fill="#1c1e21" />
    <ellipse cx="95" cy="118" rx="2.5" ry="3" fill="#4a4d52" />
    <ellipse cx="105" cy="118" rx="2.5" ry="3" fill="#4a4d52" />

    <!-- downturned mouth, drooping jowls -->
    <path d="M100,130 L100,138" fill="none" stroke="#1c1e21" stroke-width="3" stroke-linecap="round" />
    <path d="M100,138 Q80,140 70,158" fill="none" stroke="#1c1e21" stroke-width="3" stroke-linecap="round" />
    <path d="M100,138 Q120,140 130,158" fill="none" stroke="#1c1e21" stroke-width="3" stroke-linecap="round" />

    <path d="M52,150 Q100,172 148,150 L148,160 Q100,182 52,160 Z" fill="#00356B" />
    <circle cx="100" cy="168" r="6" fill="#f4c542" stroke="#00253f" stroke-width="1.5" />
  </g>
</svg>
